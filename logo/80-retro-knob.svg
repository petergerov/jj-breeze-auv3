    <stop offset="1" stop-color="#fff" stop-opacity="0.07"/></linearGradient>
  <radialGradient id="gloss" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#fff" stop-opacity="0.30"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
